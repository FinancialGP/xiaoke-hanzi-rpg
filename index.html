<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>小侠客汉字龙珠 · 识字大冒险 v4</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <!-- 背景：天空 + 岩山（全部原创 SVG/CSS 绘制） -->
  <div id="bg" aria-hidden="true">
    <div class="sky-cloud c1"></div><div class="sky-cloud c2"></div><div class="sky-cloud c3"></div>
    <svg class="mountains" viewBox="0 0 400 160" preserveAspectRatio="none">
      <defs>
        <linearGradient id="rockA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a24a"/><stop offset="1" stop-color="#b8581e"/></linearGradient>
        <linearGradient id="rockB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a3d"/><stop offset="1" stop-color="#8d4318"/></linearGradient>
      </defs>
      <path d="M0 160 L0 70 L18 66 L22 40 L52 38 L56 72 L80 76 L84 52 L104 50 L108 80 L130 84 L130 160 Z" fill="url(#rockB)" stroke="#3a1a08" stroke-width="2"/>
      <path d="M120 160 L124 96 L150 92 L156 30 L196 28 L200 90 L232 96 L236 160 Z" fill="url(#rockA)" stroke="#3a1a08" stroke-width="2"/>
      <path d="M228 160 L232 60 L262 56 L266 84 L300 86 L304 46 L338 44 L344 92 L372 96 L376 70 L400 68 L400 160 Z" fill="url(#rockB)" stroke="#3a1a08" stroke-width="2"/>
      <g stroke="#7a3510" stroke-width="1.5" opacity=".55" fill="none">
        <path d="M24 52 L50 50 M58 86 L78 88 M160 46 L192 44 M162 64 L194 62 M206 104 L228 106 M306 60 L334 58 M236 74 L260 72"/>
      </g>
      <path d="M0 160 L0 132 Q100 118 200 130 T400 126 L400 160 Z" fill="#5fae4b" stroke="#2c5a1f" stroke-width="2"/>
    </svg>
  </div>
  <div id="speed" class="speedlines hidden" aria-hidden="true"></div>

  <div class="topbar">
    <button class="round-btn hidden" id="homeBtn" type="button" aria-label="回到选人页">🏠</button>
    <div class="who" id="who"></div>
    <button class="round-btn" id="soundBtn" type="button" aria-label="音效开关">🔊</button>
    <button class="round-btn hidden" id="settingsBtn" type="button" aria-label="设置">⚙️</button>
  </div>

  <main class="wrap">
    <header class="logo" id="logo">
      <h1><span class="ball-mini"></span>小侠客汉字龙珠<span class="ball-mini"></span></h1>
      <p>集齐七颗龙珠 · 召唤神龙 · 识字大冒险</p>
    </header>
    <section id="hud"></section>
    <section class="panel" id="scene">
      <div id="story" class="story" role="status" aria-live="polite"></div>
    </section>
    <section id="quiz" class="hidden"></section>
    <div class="menu" id="menu"></div>
    <div class="log" id="log" aria-live="polite"></div>
  </main>

  <div id="fx" aria-hidden="true"></div>
  <div id="overlay" class="hidden"></div>

  <script src="hanzi_data.js?v=5"></script>
  <script src="words2.js?v=5"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
